name: Bug report
description: Report a reproducible problem with the agent, UI, or setup
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include API keys, `.env`
        contents, or other secrets in this issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and what did you expect instead?
      placeholder: The agent finished with a placeholder decision instead of a route recommendation.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected origin, destination, and scenario.
      placeholder: |
        1. Select Shenzhen to Frankfurt
        2. Choose "Port Strike in Singapore"
        3. Set cost weight to 0.8
        4. Click "Run Agent"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - Google Gemini
        - Hugging Face
        - OpenAI
        - Not applicable / UI-only issue
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model configured in `agent.py` for your provider.
      placeholder: gemini-flash-latest
  - type: textarea
    id: traceback
    attributes:
      label: Error output or traceback
      description: Paste the terminal output or browser console error, redacting secrets.
      render: shell
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, audit-log excerpts, or dependency details that help explain the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed all API keys and sensitive data from this report.
          required: true
        - label: I searched existing issues before opening this one.
          required: true
